services:
  web:
    image: ghcr.io/guardian-parental-controls/platform-server:v1.0.1
    ports:
      - "5000:5000"
    volumes:
      - timekpr_data:/app/instance
    environment:
      # Set your timezone (e.g., America/New_York, Europe/London, America/Los_Angeles)
      # See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=UTC
      # Pre-shared key/token for the websocket client agents
      - AGENT_TOKEN=super-secure-pre-shared-agent-token
      # OIDC Configuration (Keycloak/Authentik/OIDC Single Sign-On)
      # - OIDC_ISSUER_URL=https://keycloak.example.com/realms/myrealm
      # - OIDC_CLIENT_ID=timekpr-webui
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_REDIRECT_URI=http://localhost:5000/callback
      # - OIDC_VERIFY_SSL=True
      - TIMEKPR_ENABLE_BACKGROUND_TASKS=1
      - TIMEKPR_TASKS_REFRESH_EXTERNAL=0
      - TIMEKPR_TASKS_UPDATE_USER_DATA=1
      - TIMEKPR_TASKS_SYNC_DOMAIN_POLICIES=1
      - TIMEKPR_TASKS_DELIVER_ALERTS=0
      # - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/postgres
      - DATABASE_URL=sqlite:///../instance/timekpr.db
      # Sentry DSN configuration
      # - SENTRY_DSN=https://your-public-key@sentry.io/project-id
    restart: unless-stopped

  tasks:
    image: ghcr.io/guardian-parental-controls/platform-server:v1.0.1
    command: [ "python", "task_worker.py" ]
    volumes:
      - timekpr_data:/app/instance
    environment:
      - TZ=UTC
      - AGENT_TOKEN=super-secure-pre-shared-agent-token
      # - OIDC_ISSUER_URL=https://keycloak.example.com/realms/myrealm
      # - OIDC_CLIENT_ID=timekpr-webui
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_REDIRECT_URI=http://localhost:5000/callback
      # - OIDC_VERIFY_SSL=True
      - TIMEKPR_ENABLE_BACKGROUND_TASKS=1
      - TIMEKPR_TASKS_REFRESH_EXTERNAL=1
      - TIMEKPR_TASKS_UPDATE_USER_DATA=0
      - TIMEKPR_TASKS_SYNC_DOMAIN_POLICIES=0
      - TIMEKPR_TASKS_DELIVER_ALERTS=1
      # - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/postgres
      - DATABASE_URL=sqlite:///../instance/timekpr.db
      # Sentry DSN configuration
      # - SENTRY_DSN=https://your-public-key@sentry.io/project-id
    restart: unless-stopped

volumes:
  timekpr_data:
