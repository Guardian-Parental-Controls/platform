name: Translation check

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GUARDIAN_PRODUCT_ROOT: ${{ github.workspace }}
      GUARDIAN_I18N_ROOT: ${{ github.workspace }}/_translations/i18n
    steps:
      - name: Check out product
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve translations pull request
        id: translations
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get('PR_BODY', '')
          matches = re.findall(
              r'(?im)^\s*Translations:\s*(?:Guardian-Parental-Controls/translations)?#(\d+)\s*$',
              body,
          )
          if len(matches) > 1:
              raise SystemExit('Only one Translations: #<number> footer is allowed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"number={matches[0] if matches else ''}\n")
              output.write(
                  f"ref={'refs/pull/' + matches[0] + '/head' if matches else 'main'}\n"
              )
          PY

      - name: Check out translations
        uses: actions/checkout@v5
        with:
          repository: Guardian-Parental-Controls/translations
          ref: ${{ steps.translations.outputs.ref }}
          path: _translations

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check PyYAML

      - name: List changed product files
        id: changed
        run: |
          : > /tmp/changed-files.txt
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
            echo "use_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate translation catalogs
        run: python _translations/scripts/i18n/manage.py validate

      - name: Check translation key usage
        env:
          TRANSLATIONS_PR: ${{ steps.translations.outputs.number }}
        run: |
          set +e
          args=(check-usage --report-md /tmp/i18n-report.md --json /tmp/i18n-report.json)
          if [[ "${{ steps.changed.outputs.use_diff }}" == "true" ]]; then
            args+=(--changed-files /tmp/changed-files.txt)
          fi
          python _translations/scripts/i18n/manage.py "${args[@]}" | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 && -z "$TRANSLATIONS_PR" ]] &&
             python -c 'import json; raise SystemExit(not bool(json.load(open("/tmp/i18n-report.json")).get("missing_keys")))' ; then
            echo "::error::Open a translations PR first and add 'Translations: #<number>' to this pull request description."
          fi
          exit "$status"

      - name: Upload translation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: translation-report-${{ github.run_id }}
          path: |
            /tmp/i18n-report.md
            /tmp/i18n-report.json
            /tmp/i18n-check.log
          if-no-files-found: ignore
          retention-days: 14
